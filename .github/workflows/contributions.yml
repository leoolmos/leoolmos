name: Update contributions graph

# Redraws assets/contributions-{light,dark}.svg, the six-month contribution
# graph the profile README shows, and commits them when they changed.

on:
  schedule:
    - cron: "23 5 * * *" # every day, 05:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contributions.mjs
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw the graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contributions.mjs

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update contributions graph"
          git push
